releaseNotes: >-
  Blindspark v0.27.0-rc.3 (Universal Blind Relay v2): adds Phase 9 universal
  substrate upgrades (Blossom streaming SHA-256 verification, RFC 7233 Range /
  ETag / extension MIME hints for WASM & large static bundles, NIP-5A HEAD /
  Range / COEP credentialless, universal browser blind WSS /circuit relay,
  zero-payment free-grant metering seam with 4,096-blob leases, full Nostr
  NIP-40 expiration + per-socket fairness, and second-opinion Chain RPC
  headers & expanded Solana reads) alongside the full pre-mainnet security
  hardening pass (econ/WAL anti-replay, sandbox CSP, DNS-rebinding & CSRF
  guards on :9100, read-only container /app, and hardened OTA verification).
